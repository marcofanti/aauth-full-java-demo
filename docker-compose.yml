# Full AAuth (draft-11) demo in containers: UI -> backend -> supply-chain agent ->
# market-analysis agent, with the Java Person Server issuing agent, person and auth tokens.
#
# Start through the wrapper, which maps a run mode to per-service modes:
#   ./scripts/compose-up.sh [off|hwk|jwt|auth-token|consent|missions]   (default: jwt)
#
# AAuth identifiers are https origins without a port. The caddy service terminates TLS
# for ps/as/sca/maa.uma.lab with the mkcert certificate from scripts/setup-tls.sh and
# carries those names as network aliases, so containers reach each other through it; it
# also publishes :443 for the browser (stop a native Caddy first: `caddy stop`).
#
# Host prerequisites: scripts/setup-tls.sh run once (mounted read-only from
# ~/.local/share/uma-lab-tls), and /etc/hosts mapping portal/ps/as/sca/maa.uma.lab to
# 127.0.0.1. Build context is the parent agents/ directory so aauth-java-person-server is
# built from source.
name: aauth-demo

x-java-tls: &java-tls
  JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit

x-otel: &otel
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

x-tls-volume: &tls-volume ${HOME}/.local/share/uma-lab-tls:/tls:ro

services:
  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - *tls-volume
    ports:
      - "443:443"
    networks:
      default:
        aliases:
          - ps.uma.lab
          - as.uma.lab
          - sca.uma.lab
          - maa.uma.lab

  person-server:
    build:
      context: ..
      dockerfile: aauth-full-java-demo/docker/Dockerfile.person-server
    environment:
      <<: *java-tls
      AAUTH_DATABASE_URL: sqlite:////data/aauth.db
      AAUTH_PS_SIGNING_KEY_PATH: /data/ps-signing-key.pem
      AAUTH_AS_SIGNING_KEY_PATH: /data/as-signing-key.pem
      AAUTH_PS_PUBLIC_ORIGIN: https://ps.uma.lab
      AAUTH_AS_PUBLIC_ORIGIN: https://as.uma.lab
      AAUTH_PS_EGRESS_ALLOW_HOSTS: "*.uma.lab"
      AAUTH_PS_ADMIN_TOKEN: mytoken
      AAUTH_AS_PERSON_TOKEN: mytoken
      AAUTH_PS_INSECURE_DEV: "false"
      AAUTH_AS_INSECURE_DEV: "false"
    volumes:
      - ps-data:/data
      - *tls-volume

  # Stands in for the person during a demo: approves pending agent registrations and
  # first-use person-token requests (kind "person_token"). The require:user consent in
  # consent mode is left for a human, via the popup or the PS console.
  approver:
    image: curlimages/curl:8.14.1
    depends_on:
      - person-server
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ps=http://person-server:8765
        while true; do
          for id in $$(curl -sf -H "Authorization: Bearer mytoken" $$ps/person/registrations \
            | grep -o '"id":"[^"]*"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -X POST -H "Authorization: Bearer mytoken" \
              "$$ps/person/registrations/$$id/approve" && echo "approved registration $$id"
          done
          for id in $$(curl -sf -H "Authorization: Bearer mytoken" $$ps/admin/pending \
            | grep -o '{[^{}]*"kind":"person_token"[^{}]*}' \
            | grep -o '"pending_id":"[^"]*"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -X POST -H "Content-Type: application/json" -d '{"approved":true}' \
              "$$ps/consent/$$id/decision" && echo "approved person token $$id"
          done
          sleep 2
        done

  market-analysis-agent:
    build:
      context: ..
      dockerfile: aauth-full-java-demo/docker/Dockerfile.service
      args:
        SERVICE: market-analysis-agent
    command: ["--demo.aauth.mode=${MAA_MODE:-jwt}"]
    environment:
      <<: [*java-tls, *otel]
      OTEL_SERVICE_NAME: market-analysis-agent
    volumes:
      - maa-keys:/work/.aauth-demo
      - *tls-volume

  supply-chain-agent:
    build:
      context: ..
      dockerfile: aauth-full-java-demo/docker/Dockerfile.service
      args:
        SERVICE: supply-chain-agent
    command: ["--demo.aauth.mode=${SCA_MODE:-jwt}"]
    depends_on:
      - person-server
      - caddy
    environment:
      <<: [*java-tls, *otel]
      OTEL_SERVICE_NAME: supply-chain-agent
    volumes:
      - sca-keys:/work/.aauth-demo
      - *tls-volume

  backend:
    build:
      context: ..
      dockerfile: aauth-full-java-demo/docker/Dockerfile.service
      args:
        SERVICE: backend
    command: ["--demo.aauth.mode=${BACKEND_MODE:-jwt}"]
    depends_on:
      - person-server
      - caddy
    environment:
      <<: [*java-tls, *otel]
      OTEL_SERVICE_NAME: backend
    volumes:
      - backend-keys:/work/.aauth-demo
      - *tls-volume
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - portal.uma.lab

  ui:
    build:
      context: ..
      dockerfile: aauth-full-java-demo/docker/ui.Dockerfile
    ports:
      - "3050:3050"

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"

volumes:
  ps-data:
  backend-keys:
  sca-keys:
  maa-keys:
